name: Audit missing IMF WEO outcomes
on:
  push:
    branches: [analysis-imf-unmatched]

permissions: read-all

jobs:
  unmatched:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python parquet libraries
        run: python -m pip install pandas pyarrow requests
      - name: Identify unmatched country-year forecasts
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          url = "https://huggingface.co/datasets/econdataverse/imfweo/resolve/main/economic_outlook.parquet"
          columns = ["entity_id", "entity_name", "series_id", "year", "value", "publication_year", "publication_release"]
          weo = pd.read_parquet(url, columns=columns)
          mask = ((weo["series_id"] == "NGDP_RPCH") &
                  weo["entity_id"].str.fullmatch(r"[A-Z]{3}", na=False) &
                  weo["value"].notna())
          growth = weo.loc[mask].copy()
          growth["vintage_key"] = 2 * growth["publication_year"] + growth["publication_release"].eq("Fall").astype(int)
          latest = growth["vintage_key"].max()
          actuals = growth.loc[growth["vintage_key"].eq(latest), ["entity_id", "year"]].drop_duplicates()
          horizon = growth["year"] - growth["publication_year"]
          eligible = growth.loc[horizon.between(1, 5) & (growth["year"] <= (latest // 2) - 2)].copy()
          merged = eligible.merge(actuals, on=["entity_id", "year"], how="left", indicator=True)
          unmatched = merged.loc[merged["_merge"].eq("left_only")]
          print("AUDIT_LATEST_VINTAGE_KEY", latest, flush=True)
          print("AUDIT_ELIGIBLE_FORECASTS", len(eligible), flush=True)
          print("AUDIT_UNMATCHED_FORECASTS", len(unmatched), flush=True)
          print("AUDIT_UNMATCHED_COUNTRIES", unmatched["entity_id"].nunique(), flush=True)
          print("AUDIT_COUNTRIES_ALPHABETICAL", flush=True)
          print(unmatched[["entity_id", "entity_name"]].drop_duplicates().sort_values("entity_id").to_string(index=False), flush=True)
          print("AUDIT_COUNTRIES_BY_COUNT", flush=True)
          print(unmatched.groupby(["entity_id", "entity_name"], dropna=False).size().sort_values(ascending=False).to_string(), flush=True)
          print("AUDIT_MISSING_YEARS", flush=True)
          print(unmatched[["entity_id", "entity_name", "year"]].drop_duplicates().groupby(["entity_id", "entity_name"])["year"].apply(lambda x: ", ".join(map(str, sorted(x)))).to_string(), flush=True)
          PY
